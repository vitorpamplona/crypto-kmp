#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
# Apple targets build only on macOS; elsewhere skip them quietly instead of warning.
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Maven Publishing
GROUP=com.vitorpamplona.crypto
POM_ARTIFACT_ID=crypto
VERSION_NAME=2.1.1
# The JS target's code uses no DOM API, so it doesn't pull kotlin-dom-api-compat onto every
# consumer's classpath: the library depends on the Kotlin stdlib alone.
kotlin.js.stdlib.dom.api.included=false
# Magpie (Nostr + Blossom publishing). Releases go to the release key's own relays, the write relays
# of its NIP-65 list (kind 10002) and the ones vitorpamplona.com/.well-known/nostr.json lists for
# it, which is where every client looks for them. Index relays are only where that relay list is
# looked up. For more copies, add write relays to the key's kind 10002.
magpie.indexRelays=wss://purplepag.es,wss://user.kindpag.es
