#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
# Apple targets build only on macOS; elsewhere skip them quietly instead of warning.
kotlin.native.ignoreDisabledTargets=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Maven Publishing
GROUP=com.vitorpamplona.crypto
POM_ARTIFACT_ID=crypto
VERSION_NAME=2.1.0
# The JS target's code uses no DOM API, so it doesn't pull kotlin-dom-api-compat onto every
# consumer's classpath: the library depends on the Kotlin stdlib alone.
kotlin.js.stdlib.dom.api.included=false
# Magpie (Nostr + Blossom publishing): where publishToNostr reads the signer's server list (kind
# 10063) and relay list (NIP-65). Releases go to the NIP-65 write relays plus magpie.archivalRelays.
magpie.relays=wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net
magpie.archivalRelays=wss://relay.damus.io,wss://nos.lol
