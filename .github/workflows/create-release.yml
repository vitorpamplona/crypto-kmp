name: Create Release Assets

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  # The Apple tests run on macOS before anything publishes.
  test-apple:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check iOS and macOS
        run: ./gradlew :crypto:iosSimulatorArm64Test :crypto:macosArm64Test :crypto:compileTestKotlinIosArm64

  # Apple klibs cross-compile on Linux; only Apple test binaries need a Mac.
  deploy:
    needs: test-apple
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cached Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Linter (gradle)
        run: ./gradlew spotlessCheck

      - name: Check
        run: ./gradlew :crypto:checkKotlinAbi :crypto:jvmTest :crypto:testAndroidHostTest :crypto:linuxX64Test :crypto:jsTest :crypto:wasmJsTest :crypto:compileAppleMainKotlinMetadata

      # The library only: the unpublished benchmark module's npm and Maven dependencies
      # mustn't be able to block a release.
      - name: Build (gradle)
        run: ./gradlew :crypto:assemble

      # Tag v1.2.3 publishes version 1.2.3.
      - name: Set version for tag
        run: |
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # Releases go to Nostr + Blossom through Magpie, which isn't on the Plugin Portal yet: a
      # pinned commit, included as a build by -PmagpieDir. Bump the ref to take a new Magpie.
      - name: Checkout Magpie
        uses: actions/checkout@v7
        with:
          repository: vitorpamplona/magpie
          ref: f0dc6104bbba8274db6a1a602500752b52294e1c
          path: .magpie

      # Uploads every publication to the signer's Blossom servers (kind 10063) and signs one
      # release event (kind 3071) for all of them, sent to its NIP-65 write relays and
      # magpie.archivalRelays. The key never reaches CI: MAGPIE_BUNKER is a NIP-46 bunker URI,
      # and vitorpamplona.com/.well-known/nostr.json must name it as "releases", or the publish
      # refuses to sign (consumers would refuse the release anyway).
      - name: Publish
        run: ./gradlew :crypto:publishToNostr -PmagpieDir=.magpie
        env:
          MAGPIE_BUNKER: ${{ secrets.MAGPIE_BUNKER }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
